# 公文纠错知识库（可不断积累）
# 写法原则：以「正确怎么写 + 前提条件 + 正误对照」正向说明为主。
#
# 新增条目步骤：
# 1) 补全 id / title / premise（何时适用）/ correct_examples / incorrect_examples
# 2) 能确定匹配的规则再写 patches（正则）；拿不准的只进提示、不写补丁，交给模型对照
# 3) patches 的 pattern 用 YAML 单引号，反斜杠只写一层，如 (\d{1,2})\.(\d{1,2})
# 4) level: error=红（高置信专项） / suggest=黄

version: 1
updated: "2026-08-27"

# 正向总则：告诉模型「应当怎样核对」，而不是一长串「不要怎样」
positive_method: |
  请先通读全文理解语境，再按本库条目核对。
  对命中「前提条件」的写法，优先采用「正确示例」中的规范形式给出修改建议。
  未命中前提时，不要机械套用条目。
  法律条款、地名等须结合上下文判断；材料自洽且无笔误时保持原文。

rules:
  - id: event_date_middle_dot
    title: 事件/行动日期用居中间隔号「·」
    premise: |
      当「月.日」或「月·日」用于指称某次抓捕行动、专案、专项行动、纪念日、事故节点等
      「事件标签」时（如「3·10抓捕行动」「在3·10行动中」），月与日之间应使用中文间隔号「·」
      （居中点），这是公文中对此类命名日期的规范写法。
      前提：该数字组合是事件名的一部分，而不是普通小数、编号第×.×条、软件版本号或英文句号列表。
    correct_examples:
      - "3·10抓捕行动"
      - "在3·10专案侦办中"
      - "5·12抗震救灾"
      - "开展6·26禁毒专项行动"
    incorrect_examples:
      - wrong: "3.10抓捕行动"
        right: "3·10抓捕行动"
        note: "事件日期月日之间用居中间隔号「·」"
      - wrong: "在3.10行动中缴获"
        right: "在3·10行动中缴获"
        note: "事件日期月日之间用居中间隔号「·」"
    level: error
    # 确定性补丁：月.日 + 其后若干字内出现行动类关键词 → 改为居中「·」
    # YAML 单引号内反斜杠按字面保留，勿写成 \\d / \\. 否则正则会失效
    patches:
      - pattern: '(?<![\d.])(\d{1,2})\.(\d{1,2})(?=[\u4e00-\u9fff\s]{0,10}(?:抓捕|行动|专案|专项|战役|纪念日|事故|事件))'
        replacement: '\1·\2'

  - id: formal_chinese_date_dot
    title: 成文日期等完整年月日不宜用下脚点简写
    premise: |
      当表达公文成文日期、落款日期等「完整年月日」时，规范写法为「XXXX年X月X日」。
      若材料中把成文/落款日期写成「XXXX.X.X」且上下文明确是日期（落款、成文于、印发日期等），
      可建议改为汉字年月日形式。
      前提：确认为成文/落款/印发类日期；不适用于事件标签「3·10」、小数、文号。
    correct_examples:
      - "2026年1月5日"
      - "成文日期：2025年12月18日"
    incorrect_examples:
      - wrong: "成文日期：2026.1.5"
        right: "成文日期：2026年1月5日"
        note: "落款/成文日期用汉字年月日"
    level: suggest
    patches: []

  - id: keep_contextual_place_and_law
    title: 条款与地名以材料语境为准（正向保持）
    premise: |
      正确做法：同一材料中，办案地、户籍地、案发地、会议召开地可以不同，应分别保留。
      法律条款引用以材料表述为准；仅在出现明显笔误且上下文可证时才改。
      本条用于提醒「正确状态是什么」，不是要求改写地名或条款。
    correct_examples:
      - "户籍地为甲县，案发地位于乙市（两处均保留）"
      - "依据《刑法》第××条……（与材料引用一致且无笔误则保持）"
    incorrect_examples: []
    level: suggest
    patches: []
