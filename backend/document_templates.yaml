        footer_cm: 1.75
      spacing:
        title_line_rule: exact
        title_line_pt: 32
        body_line_rule: single

  bulletin:
    order: 9
    label: 通报
    description: 适用于表彰先进、批评错误或传达重要情况的通报
    reference: 广西壮族自治区公安厅办公室关于近期全区涉警道路交通事故情况的通报.wps
    classification:
      title_keywords: [通报]
      title_max_index: 14
      title_leading_lines: 2
      recipient_max_index: 12
      recipient_after_title_window: 6
      recipient: required
      subtitle: optional
      signature: required
      signature_unit_max_len: 36
    format:
      page:
        margin_cm: { top: 3.70, bottom: 3.50, left: 2.80, right: 2.60 }
        header_cm: 1.50
        footer_cm: 1.75
      spacing:
        title_line_rule: exact
        title_line_pt: 32
        body_line_rule: exact
        body_line_pt: 28

  report:
    order: 10
    label: 报告
    description: 适用于向上级机关汇报工作、反映情况或回复询问的报告
    reference: 广西壮族自治区公安厅知识产权犯罪侦查总队关于非标电缆案件侦办进展情况的报告.docx
    classification:
      title_keywords: [报告]
      title_max_index: 14
      title_leading_lines: 2
      recipient_max_index: 12
      recipient_after_title_window: 6
      recipient: required
      subtitle: optional
      signature: required
      signature_unit_max_len: 36
      closing_phrases: [特此报告]
    format:
      page:
        margin_cm: { top: 3.70, bottom: 3.50, left: 2.80, right: 2.60 }
        header_cm: 1.50
