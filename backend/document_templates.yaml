# 公文文种模板配置
#
# 模板只覆盖标题、主送机关、正文层级、附件、落款及页面基础参数；
# 不生成红头、传真版头、发文字号、签发人或版记。
# format 中未声明的字段继承 gongwen_config.yaml。

default: generic

templates:
  generic:
    order: 0
    label: 通用转换
    description: 使用现有通用规则识别并套用公文格式
    reference: gongwen_config.yaml
    classification:
      title_keywords: []
      title_max_index: 20
      recipient_max_index: 8
      recipient_after_title_window: 6
      recipient: optional
      subtitle: optional
      signature: optional
      signature_unit_max_len: 36
    format: {}

  resolution:
    order: 1
    label: 决议
    description: 适用于会议审议通过的决议，支持副标题、分项正文和落款
    reference: XX省公安厅党委会议决议.docx
    classification:
      title_keywords: [决议]
      title_max_index: 12
      title_leading_lines: 2
      recipient: forbidden
      subtitle: optional
      signature: required
      signature_unit_max_len: 36
    format:
      page:
        margin_cm: { top: 2.54, bottom: 2.54, left: 3.17, right: 3.17 }
        header_cm: 1.50
        footer_cm: 1.75
      spacing:
        title_line_rule: single
        body_line_rule: single

  decision:
    order: 2
    label: 决定
    description: 适用于作出重要决策、奖惩或部署事项的决定
    reference: 广西壮族自治区公安厅关于给厅机关2024年度公务员考核优秀等次民警记功嘉奖的决定.wps
    classification:
      title_keywords: [决定]
      title_max_index: 12
      title_leading_lines: 2
      recipient: forbidden
      subtitle: optional
      signature: required
      signature_unit_max_len: 36
    format:
      page:
        margin_cm: { top: 3.70, bottom: 2.54, left: 2.38, right: 2.80 }
        header_cm: 1.50
        footer_cm: 1.75
      spacing:
        title_line_rule: exact
        title_line_pt: 32
        body_line_rule: single

  order:
    order: 3
    label: 命令（令）
    description: 适用于发布命令、任免或授予事项，正文通常不设主送机关
    reference: 广西壮族自治区公安厅关于授予和晋升赖志庸等同志人民警察警司警衔的命令.docx
    classification:
      title_keywords: [命令, 令]
      title_max_index: 10
      title_leading_lines: 1
      recipient: forbidden
      subtitle: optional
      signature: optional
      signature_unit_max_len: 36
    format:
      page:
        margin_cm: { top: 2.54, bottom: 2.54, left: 2.70, right: 2.70 }
        header_cm: 1.50
        footer_cm: 1.75
      spacing:
        title_line_rule: exact
        title_line_pt: 32
        body_line_rule: exact
        body_line_pt: 30
      styles:
        body: { first_line_chars: 0 }
        h1: { first_line_chars: 0 }
        h2: { first_line_chars: 0 }
        h3: { first_line_chars: 0 }
        h4: { first_line_chars: 0 }

  communique:
    order: 4
    label: 公报
    description: 适用于公开发布重要决定、事项或统计情况的公报
    reference: XX省公安厅环食药侦专项工作公报.docx
    classification:
      title_keywords: [公报]
      title_max_index: 12
      title_leading_lines: 2
