        footer_cm: 1.75
      spacing:
        title_line_rule: exact
        title_line_pt: 32
        body_line_rule: multiple
        body_line_multiple: 1.0
      styles:
        body: { first_line_chars: 0 }
        h1: { first_line_chars: 0 }
        h2: { first_line_chars: 0 }
        h3: { first_line_chars: 0 }
        h4: { first_line_chars: 0 }

  public_notice:
    order: 6
    label: 通告
    description: 适用于在一定范围内公布应当遵守或周知事项的通告
    reference: XX省公安厅通告.docx
    classification:
      title_keywords: [通告]
      title_max_index: 12
      title_leading_lines: 2
      recipient: forbidden
      subtitle: optional
      signature: required
      signature_unit_max_len: 36
      closing_phrases: [特此通告]
    format:
      page:
        margin_cm: { top: 2.54, bottom: 2.54, left: 3.17, right: 3.17 }
        header_cm: 1.50
        footer_cm: 1.75
      spacing:
        title_line_rule: single
        body_line_rule: single
      styles:
        h1: { cn: 仿宋_GB2312, bold: false }

  opinion:
    order: 7
    label: 意见
    description: 适用于提出见解、处理办法或工作要求的意见
    reference: 广西生态警务机制建设实施意见-20260624稿2(1).docx
    classification:
      title_keywords: [意见]
      title_max_index: 14
      title_leading_lines: 2
      recipient: forbidden
      subtitle: optional
      signature: optional
      signature_unit_max_len: 36
    format:
      page:
        margin_cm: { top: 2.54, bottom: 2.54, left: 3.17, right: 3.17 }
        header_cm: 1.50
        footer_cm: 1.75
      spacing:
        title_line_rule: exact
        title_line_pt: 32
        body_line_rule: single

  notice:
    order: 8
    label: 通知
    description: 适用于发布、传达事项或要求下级机关执行的通知
    reference: 广西壮族自治区公安厅办公室关于厅领导赴梧州市开展调研的通知.docx
