        header_cm: 1.50
        footer_cm: 1.75
      spacing:
        title_line_rule: single
        body_line_rule: single

  announcement:
    order: 5
    label: 公告
    description: 适用于向社会公开重要事项或法定事项的公告
    reference: 广西壮族自治区公安厅关于委托下放保安服务公司设立及法定代表人变更审批权限的公告.docx
